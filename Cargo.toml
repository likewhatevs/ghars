[package]
name = "ghars"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "GPL-2.0-only"
repository = "https://github.com/likewhatevs/ghars"
description = "Declaratively manage self-hosted GitHub Actions runners (systemd + Linux)."
readme = "README.md"
keywords = ["github", "actions", "runner", "systemd", "self-hosted"]
categories = ["command-line-utilities"]

[lib]
name = "ghars"
path = "src/lib.rs"

[[bin]]
name = "ghars"
path = "src/main.rs"

# SEC-02 runsvc trampoline. Compiled binary, NOT shell.
# Installed at /usr/lib/ghars/runsvc-wrapper (root:root mode 0755).
# Invoked from the runner unit via `ExecStart=/usr/lib/ghars/runsvc-wrapper
# %i` with NO prefix. DynamicUser=yes plus
# `User=ghars-tz-<TRUST_ZONE>` (set by the per-runner 00-ghars.conf
# drop-in) establish the runner identity before the wrapper starts,
# and the unit's full sandbox stays applied — TemporaryFileSystem=/:ro,
# BindReadOnlyPaths, PrivateDevices, NetworkNamespacePath,
# SystemCallFilter, etc. — to the wrapper and to the runsvc.sh process
# it execs into. CapabilityBoundingSet is empty: with no setuid/setgid
# step, neither CAP_SETUID nor CAP_SETGID is required. The wrapper
# opens /var/lib/ghars/<TRUST_ZONE>/ghars-<INSTANCE>/runsvc.sh with
# O_NOFOLLOW, recomputes SHA-256, compares against the
# X-Ghars-Runsvc-Sha256 annotation in the 00-ghars.conf drop-in (also
# read with O_NOFOLLOW), and fexecve's the verified file descriptor on
# match — closing the open-then-rename TOCTOU window.
[[bin]]
name = "runsvc-wrapper"
path = "src/bin/runsvc_wrapper.rs"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
# Pedantic lints are enabled globally (warn). The following are
# individually silenced because they are stylistic preferences or
# produce excessive noise on this codebase. Correctness-relevant casts
# (cast_possible_truncation, cast_sign_loss, etc.) are silenced
# globally here; individual call sites should use targeted #[allow]
# with safety justification as they are audited.
doc_lazy_continuation = "allow"
doc_overindented_list_items = "allow"
empty_line_after_doc_comments = "allow"
items_after_statements = "allow"
format_push_string = "allow"
too_many_lines = "allow"
match_same_arms = "allow"
struct_excessive_bools = "allow"
manual_let_else = "allow"
missing_panics_doc = "allow"
missing_errors_doc = "allow"
unnecessary_debug_formatting = "allow"
case_sensitive_file_extension_comparisons = "allow"
inline_always = "allow"
large_enum_variant = "allow"
ref_option = "allow"
wildcard_in_or_patterns = "allow"
similar_names = "allow"
unused_self = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
unnecessary_wraps = "allow"
type_complexity = "allow"
doc_link_with_quotes = "allow"
used_underscore_binding = "allow"

[dependencies]
clap = { version = "4", features = ["derive", "wrap_help", "env"] }
clap_complete = "4"
clap_mangen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
anyhow = "1"
sha2 = "0.10"
hex = "0.4"
tar = "0.4"
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-native-roots", "json", "stream", "gzip"] }
# Design Part 1 listed `default-features = false, features = ["blocking-api"]`
# but zbus 5 requires either `async-io` (default) or `tokio` as the executor
# backend — `blocking-api` wraps it. We re-enable defaults so async-io is the
# backend (matches the design's "zbus uses its own executor, NOT tokio"
# rationale; both runtimes coexist via independent executors).
zbus = { version = "5", features = ["blocking-api"] }
# octocrab 0.42's `rustls` feature pulls hyper-rustls and calls
# `with_native_roots()`, which loads the system trust store via
# `rustls-native-certs`. 0.42's builder offers `with_service`/`with_layer`,
# not `with_client`, and uses hyper directly rather than reqwest, so
# passing a custom reqwest client is not supported. `default-client` is
# required so `OctocrabBuilder::build()` exists (gated on the
# `default-client` feature); `rustls-ring` selects ring as the rustls
# CryptoProvider.
octocrab = { version = "0.42", default-features = false, features = ["rustls", "default-client", "rustls-ring"] }
# tokio: only `rt` feature. main() is sync; we use OnceLock<Runtime> with
# block_on per call, NOT #[tokio::main] (so no `macros`). octocrab uses
# hyper-rustls directly and manages its own timeouts, so no `time` feature
# needed. Minimal surface.
tokio = { version = "1", default-features = false, features = ["rt"] }
regex = "1"
url = "2"
ipnet = { version = "2", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
camino = { version = "1", features = ["serde1"] }
indexmap = { version = "2", features = ["serde"] }
similar = "2"
bytesize = "1"
fs2 = "0.4"
rpassword = "7"
# Used by auth::GithubAppToken to build the EncodingKey that
# octocrab::OctocrabBuilder::app() requires. octocrab depends on
# jsonwebtoken transitively but does not re-export it; AppAuth holds
# an EncodingKey directly.
jsonwebtoken = { version = "9", default-features = false }
# libc::O_NOFOLLOW for SEC-06 (open private_key_path with O_NOFOLLOW so
# the kernel rejects symlinks at open(2) time, closing the lstat-then-open
# TOCTOU window the design calls out).
libc = "0.2"
# nix wraps libc syscalls in safe APIs so callers stay within the
# workspace's `unsafe_code = "forbid"` lint.
# - `user`    → `unistd::{Uid, Gid}` types and `unistd::geteuid`
#               (apply.rs ownership ops, root-effective-uid checks in
#               extract.rs / netns.rs). DynamicUser= handles runner
#               identity, so no getpwnam_r / Users-trait lookup is
#               needed.
# - `process` → `unistd::fexecve`. The runsvc-wrapper binary execs
#               the verified runsvc.sh by file descriptor, never by
#               path — closing the open-then-rename TOCTOU window. No
#               setuid/setgid/setgroups: DynamicUser= already
#               established the runner identity before the wrapper
#               starts.
# - `fs`      → `fcntl::{renameat2, RenameFlags::RENAME_EXCHANGE}` for
#               extract.rs's atomic upgrade-in-place directory swap
#               (gnu only; musl builds synthesize ENOSYS and use
#               the remove-then-rename fallback — see
#               extract.rs::renameat2_exchange_real);
#               `fcntl::{FcntlArg, FdFlag, fcntl}` so the
#               runsvc-wrapper can clear FD_CLOEXEC on the verified
#               script fd before fexecve (binfmt_script requires
#               post-exec read access via /proc/self/fd/N);
#               `unistd::fchown` (apply.rs ownership ops; gated on
#               `all(user, fs)`); `sys::stat::{utimensat,
#               UtimensatFlags::NoFollowSymlink}` (apply.rs symlink-
#               safe mtime back-dating in stale-temp gc tests);
#               `unistd::mkfifo` + `sys::stat::Mode` (validators.rs
#               FIFO-rejection regression tests).
nix = { version = "0.29", features = ["fs", "user", "process"] }
# chrono is used for RegistrationToken.expires_at (DateTime<Utc>),
# matching octocrab's SelfHostedRunnerToken.expires_at type so the
# token round-trip preserves UTC instant precision without
# SystemTime / nanosecond conversion artifacts.
chrono = { version = "0.4", default-features = false, features = ["std"] }
env = "1"
# Zeroize-on-drop for `auth::RegistrationToken.value`. The runner
# registration / removal token is short-lived but plaintext: a panic
# between mint and consume would leave the value on unwound stack /
# heap frames in cleartext until the OS reclaims pages. zeroize scrubs
# the backing memory in `Drop` (including during panic unwind) using
# volatile-write + compiler-fence to defeat dead-store elimination.
# Pure-Rust, no_std-compatible, RustCrypto-org curated. The `derive`
# feature gives the `#[derive(ZeroizeOnDrop)]` macro used on
# `RegistrationToken` (with `#[zeroize(skip)]` on the non-secret
# `source` / `expires_at` fields).
zeroize = { version = "1", features = ["derive"] }
# Mn-class rejection: `is_disallowed_hidden_char` rejects all
# Unicode NonspacingMark (Mn) code points uniformly so combining
# diacriticals (e.g. U+0300 COMBINING GRAVE ACCENT) cannot overlay
# ASCII characters in token_file paths. unicode-general-category
# provides the General_Category lookup against the canonical UCD
# data; it is a small dependency-free crate (MIT/Apache-2.0).
unicode-general-category = "1"

[dev-dependencies]
insta = { version = "1", features = ["yaml", "filters"] }
tempfile = "3"
mockito = "1"
proptest = "1"
rstest = "0.23"
assert_fs = "1"
predicates = "3"
assert_cmd = "2"
# Captures `tracing` events into per-test buffers so
# `discover_warns_on_oversize_cache_pool_name` (state.rs) can assert
# that `state::discover()` emits a structured warning when an oversize
# cache pool name is found on disk.
tracing-test = "0.2"

# cargo-mutants profile — disables debug symbols to halve build time
# during mutation runs. Mutations intentionally fail tests, so loss of
# stack-trace fidelity is fine. Per https://mutants.rs/performance.html.
# .cargo/mutants.toml selects this via `profile = "mutants"`.
[profile.mutants]
inherits = "test"
debug = "none"
