# cargo-mutants configuration. Schema: https://mutants.rs/skip_files.html
#
# Excludes target adapter modules where the unit tests intentionally
# don't drive the kernel/D-Bus/network paths. Mutating these files
# would require either a live D-Bus + systemd + nftables environment
# (CI runners don't have one wired) or fixtures that haven't been
# synthesized yet. Re-include each file when its tester gap closes:
# preflight.rs needs synthesized /etc/os-release fixtures; netns.rs
# needs a mocking seam in front of the ip / nft / sysctl / systemctl
# shell-outs; the cli command modules dispatch into DbusSystemd::new
# (live D-Bus only); systemd/dbus.rs IS the live D-Bus adapter.

profile = "mutants"

exclude_globs = [
  "src/main.rs",
  # CLI command dispatch modules call DbusSystemd::new() and other
  # live D-Bus paths. Mutating logic without a live D-Bus produces
  # only timeout-class outcomes.
  "src/cli/cmd_*.rs",
  # preflight.rs reads /etc/os-release, /proc/self/status, /sys; tests
  # need synthesized filesystem fixtures before mutation is productive.
  "src/preflight.rs",
  # netns.rs shells out to ip / nft / sysctl / systemctl; without a
  # mocking seam the mutations time out instead of being caught.
  "src/netns.rs",
  # systemd/dbus.rs is the live D-Bus adapter — pure-logic mutation
  # runs would still load it. The render_* + validate_* helpers in
  # systemd/units.rs ARE pure and remain in scope.
  "src/systemd/dbus.rs",
]

# Mutants on a slow runner: nextest's pre-compile pass + the actual
# mutation cycles can blow past cargo-mutants's default timeout when
# CI is loaded. Multiply the auto-derived timeout to give headroom
# for ubuntu-latest (4-core).
timeout_multiplier = 2.0

# Minimum test timeout (seconds) — lower-bounds the auto-derived
# value so tests that finish quickly under the baseline run still
# get enough time when mutated to hang out a full timeout window.
minimum_test_timeout = 60.0
