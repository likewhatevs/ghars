# ghars CI: per-PR merge-gate workflow.
#
# Every job contributes a coverage, audit, or build artefact to the
# merge gate. Inline shell stays in the YAML rather than living in
# separate scripts so the gate is auditable in one place.
#
# Job matrix:
#   test       — fmt + clippy -D warnings + nextest run + llvm-cov 70% gate
#   musl       — release build to x86_64-unknown-linux-musl, both
#                ghars and runsvc-wrapper asserted statically linked
#                via `file`
#   audit      — cargo deny check (advisories, bans, sources, licenses)
#   docs       — mdbook build + test + linkcheck against docs/
#   mutants-pr — cargo mutants per-PR (--in-diff origin/main); badge
#                JSON is published manually via `just scripts::publish-mutants`
#
# `cargo nextest run` is the canonical test runner; coverage is
# collected via `cargo llvm-cov nextest` so the same nextest
# invocation drives both gates.
#
# fail-under-lines floor is currently 70 because actual coverage is
# below the design's 90 target. Ratchet upward as tester tasks land —
# bump to 75 → 80 → 85 → 90 in lockstep with real coverage growth.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  test:
    name: fmt + clippy + nextest + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.91
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      # 70% line-coverage gate. The nextest profile-default is
      # `default`; runner timeouts are bounded by the runner's own 6h
      # cap so a flaky network test cannot stall CI indefinitely.
      - name: cargo llvm-cov nextest (70% line coverage gate)
        run: |
          cargo llvm-cov nextest \
            --workspace \
            --lcov \
            --output-path lcov.info \
            --fail-under-lines 70

      - name: Upload coverage to codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  musl:
    # Static-binary build via musl. `file` asserts each ELF is
    # statically linked; a dynamic dependency creep would surface here
    # as a "dynamically linked" string. ghars produces two binaries
    # (ghars + runsvc-wrapper); both are checked.
    name: release build (x86_64-unknown-linux-musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - name: cargo build --release --target x86_64-unknown-linux-musl
        run: cargo build --release --target x86_64-unknown-linux-musl
      - name: Assert statically linked
        run: |
          set -euo pipefail
          for BIN in ghars runsvc-wrapper; do
            P="target/x86_64-unknown-linux-musl/release/$BIN"
            file "$P"
            file "$P" | grep -q "statically linked"
          done

  audit:
    # cargo deny check on every PR. The deny.toml file
    # (advisories, bans, sources, licenses) lives at the repo root; a
    # missing config surfaces as a hard error from cargo-deny, which
    # is intentional — supply-chain rules are part of the merge gate,
    # not optional metadata.
    #
    # cargo-audit is intentionally NOT run: cargo-deny's `advisories`
    # check is a strict superset (same RustSec database, plus banned
    # crates / source restrictions / license rules in one tool).
    name: cargo deny check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: cargo deny check
        run: cargo deny check advisories bans sources licenses

  docs:
    # mdbook build + test + linkcheck. The mdbook source tree at
    # `docs/` is the public documentation; broken code blocks or dead
    # links break the build.
    name: mdbook build + test + linkcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91
      - uses: Swatinem/rust-cache@v2
      - name: Install mdbook
        uses: taiki-e/install-action@mdbook
      - name: Install mdbook-linkcheck
        run: cargo install mdbook-linkcheck --locked
      - name: mdbook build
        run: mdbook build docs
      - name: mdbook test
        run: mdbook test docs
      - name: Deploy mdbook to gh-pages
        if: github.ref == 'refs/heads/main' && hashFiles('docs/src/SUMMARY.md') != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./docs/book/html
          destination_dir: book
          keep_files: true
          commit_message: "ci: refresh mdbook"

  mutants-pr:
    # Per-PR cargo-mutants in --in-diff mode. Fails the gate if any
    # mutant is missed. The shields.io
    # badge JSON is published manually via `just scripts::publish-mutants`.
    name: cargo mutants (--in-diff origin/main)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.91
      - uses: Swatinem/rust-cache@v2
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      - name: Install cargo-mutants
        uses: taiki-e/install-action@cargo-mutants
      - name: cargo mutants --in-diff
        run: |
          set -euo pipefail
          git diff origin/main -- . > pr.diff
          cargo mutants --test-tool nextest --in-diff pr.diff --json --output mutants.out

      # Always upload the cargo-mutants output directory as a PR
      # artifact. cargo-mutants writes the JSON outcomes plus a
      # human-readable `mutants.out/missed.txt`, the per-mutant diff
      # tree, and (when --html is enabled in a future iteration) the
      # HTML report. Uploading on `if: always()` so reviewers can
      # inspect the artifact even when the score gate fails the job.
      # `retention-days: 14` matches the GitHub default for branches;
      # the artifact is per-PR and rotates out naturally.
      - name: Upload cargo-mutants output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-mutants-output
          path: mutants.out
          if-no-files-found: warn
          retention-days: 14

      - name: Compute score + gate on missed mutants
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f mutants.out/outcomes.json ]; then
            echo "no outcomes; skipping score computation"
            exit 0
          fi
          caught=$(jq -r '.caught'  mutants.out/outcomes.json)
          missed=$(jq -r '.missed'  mutants.out/outcomes.json)
          timeout=$(jq -r '.timeout' mutants.out/outcomes.json)
          denom=$((caught + missed + timeout))
          if [ "$denom" -eq 0 ]; then
            score=100
          else
            score=$((caught * 100 / denom))
          fi
          echo "Mutants: caught=$caught missed=$missed timeout=$timeout score=${score}%"
          # PR-mode: fail if any missed mutants.
          if [ "$missed" -gt 0 ]; then
            echo "::error::cargo-mutants: $missed missed mutant(s) — PR gate fails"
            exit 1
          fi
