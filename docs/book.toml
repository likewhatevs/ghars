[book]
title = "ghars"
description = "Declaratively manage self-hosted GitHub Actions runners on systemd-based Linux hosts."
authors = ["Pat Somaru"]
language = "en"
src = "src"

[output.html]
default-theme = "rust"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/likewhatevs/ghars"
edit-url-template = "https://github.com/likewhatevs/ghars/edit/main/docs/{path}"

# mdbook-linkcheck runs alongside the html backend when configured.
# Without this section the CI `mdbook build` skips link validation.
# `follow-web-links = false` keeps the gate offline and deterministic;
# external URL drift is flagged by manual link audits, not the merge
# gate.
[output.linkcheck]
follow-web-links = false
warning-policy = "error"
